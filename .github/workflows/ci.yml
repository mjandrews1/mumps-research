name: CI

on:
  push:
  pull_request:

jobs:
  python-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check Python tooling
        run: |
          python -m py_compile tools/select_study_subset.py wp1/oracle/freeze_oracle.py
      - name: Validate committed protocol JSON
        run: |
          python -c "import json,sys; [json.load(open(p)) for p in __import__('glob').glob('tools/examples/*.json')]; print('protocol JSON ok')"
