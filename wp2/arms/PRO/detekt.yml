# detekt config for the PRO translation arm.
#
# The arm translates vendor C (mumps-14-may-2026.tgz) line-for-line:
# function sizes, parameter counts, magic numbers and naming follow
# the VENDOR, not Kotlin idiom. Those rule sets are therefore off.
# Everything else stays at detekt defaults (build-upon-default),
# so potential bugs, exception handling and correctness rules
# still run.

complexity:
  active: false

style:
  active: false

naming:
  active: false

# Blanket leniency for the deliberately vendor-shaped constructs
# that survive in the active rule sets:
empty-blocks:
  EmptyFunctionBlock:
    active: false          # h014 TODO-stubs and dead vendor arms
  EmptyElseBlock:
    active: false          # vendor empty else {} fall-through arms (C has no
                          # "no else" requirement; the empty arm IS the
                          # translated body - GlobalOps disambiguation chains)
exceptions:
  TooGenericExceptionCaught:
    active: false          # fopen/edge fopen-style try/catch carriers
  SwallowedException:
    active: false          # C ignores error returns (fopen etc.); the
                          # catch-and-continue carrier renders the vendor's
                          # own error paths - rethrowing would diverge
performance:
  SpreadOperator:
    active: false          # C varargs call shape (GlobalCarrier sprintf
                          # seat); the array copy is the vendor's own
                          # varargs marshalling
